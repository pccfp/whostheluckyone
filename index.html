<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gun Spinner Roulette</title>
  <style>
    body {
      background: #000;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      overflow: hidden;
    }

    .wheel {
      position: relative;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      overflow: hidden;
      border: 8px solid #111;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .half {
      position: absolute;
      width: 100%;
      height: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
    }

    .half.top {
      background: #fff;
      color: #000;
      top: 0;
    }

    .half.bottom {
      background: #000;
      color: #fff;
      bottom: 0;
    }

    .gun {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 150px; /* 50% smaller than original 200px */
      height: auto;
      z-index: 2;
      transform: translate(-50%, -50%) rotate(0deg);
      transform-origin: center center;
      transition: transform 4s cubic-bezier(0.33, 1, 0.68, 1);
      filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.9));
      pointer-events: none;
    }

    button {
      margin-top: 50px;
      background: #fff;
      color: #000;
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
    }

    button:hover {
      background: #000;
      color: #fff;
      border: 1px solid #fff;
    }
  </style>
</head>
<body>
  <div class="wheel">
    <div class="half top">Andre</div>
    <div class="half bottom">Feli</div>
    <img src="classic-9mm-greenish-gun-11530957963jrzb8jp9fu-removebg-preview.png" alt="Gun" id="gun" class="gun" />
  </div>

  <button id="spin">SPIN</button>

  <script>
    const gun = document.getElementById("gun");
    const spinButton = document.getElementById("spin");
    let currentRotation = 0;

    spinButton.addEventListener("click", () => {
      // Randomly choose the winner
      const winner = Math.random() < 0.5 ? "Andre" : "Feli";

      // Determine final rotation so the right side points at the winner
      let targetAngle = winner === "Andre" ? 90 : 270;

      // Add multiple full spins for dramatic effect
      const spins = 5; // full 360° rotations
      const spinAmount = spins * 360 + targetAngle - (currentRotation % 360);

      currentRotation += spinAmount;

      gun.style.transform = `translate(-50%, -50%) rotate(${currentRotation}deg)`;

      setTimeout(() => {
        // Invert the alert name to match what the right side points to
        const alertName = winner === "Andre" ? "Feli" : "Andre";
        alert(`🎯 Good luck ${alertName}!`);
      }, 4000);
    });
  </script>
</body>
</html>
